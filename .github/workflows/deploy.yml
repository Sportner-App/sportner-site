name: Siteyi yayınla

# GitHub Pages kaynağı "GitHub Actions" olmalı:
# Depo → Settings → Pages → Source → GitHub Actions.
# "Deploy from a branch" seçiliyken bu akış çalışır ama yayına çıkmaz.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Yayın sırası korunur; devam eden bir yayın iptal edilmez.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Görseller public/ altında depoda duruyor; tools/gorselleri-hazirla.mjs
      # yalnızca yerelde, kaynak dosyalar elde varken çalıştırılır.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - id: yayin
        uses: actions/deploy-pages@v4
